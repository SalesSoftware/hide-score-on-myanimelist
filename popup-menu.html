<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Popup MAL score hider</title>
	<script src="js/storageSync.class.js"></script>
	<link rel="stylesheet" type="text/css" href="css/popup-menu.css">
	<script src="js/popup-menu.js"></script>
</head>
<body>
	<div class="errorTab">
		<p>
			<b> <!-- Where the error is transcribed --></b>
		</p>
	</div>
	<main> 
		<!-- All options -->
		<div class="stat-option">
			<input type="checkbox" id="score" name="score">
			<label for="score"> Score </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="users" name="users">
			<label for="users"> Users </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="rank" name="rank">
			<label for="rank"> Rank </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="popularity" name="popularity">
			<label for="popularity"> Popularity </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="members" name="members">
			<label for="members"> Members </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="favorites" name="favorites">
			<label for="favorites"> Favorites </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="ratio_bar" name="ratio_bar">
			<label for="ratio_bar"> Review Ratio Bar </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="recommended" name="recommended">
			<label for="recommended"> Recommended </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="mixed" name="mixed">
			<label for="mixed"> Mixed Feelings </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="not_recommended" name="not_recommended">
			<label for="not_recommended"> Not Recommended </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="review_amount" name="review_amount">
			<label for="review_amount"> Review Amount </label>
		</div>
	</main>
</body>
</html>
