<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Test</title>	
	<link rel="stylesheet" type="text/css" href="css/popup-menu.css">
	<script type="module" src="js/popup-menu.js"></script>
</head>
<body>
	<main> 
		<!-- All options -->
		<div class="stat-option">
			<input type="checkbox" id="score" name="score">
			<label for="score"> Score </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="users" name="users">
			<label for="users"> Users </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="rank" name="rank">
			<label for="rank"> Rank </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="popularity" name="popularity">
			<label for="popularity"> Popularity </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="members" name="members">
			<label for="members"> Members </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="favorites" name="favorites">
			<label for="favorites"> Favorites </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="ratio-bar" name="ratio-bar">
			<label for="ratio-bar"> Review Ratio Bar </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="recommended" name="recommended">
			<label for="recommended"> Recommended </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="mixed-feelings" name="mixed-feelings">
			<label for="mixed-feelings"> Mixed Feelings </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="not-recommended" name="not-recommended">
			<label for="not-recommended"> Not Recommended </label>
		</div>
		<div class="stat-option">
			<input type="checkbox" id="review-amount" name="review-amount">
			<label for="review-amount"> Review Amount </label>
		</div>
		<button type="button">Save</button>
	</main>
</body>
</html>
